name: Ask AI
on:
  workflow_dispatch:

permissions:
  models: read          # ← 必须缩进 2 空格，与 jobs 同级

jobs:
  ask-ai:
    runs-on: ubuntu-26.04
    steps:
      - name: AI Inference
        id: ai-response
        uses: Pedro-Accarini/ActionsAI@1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Give me a programming joke.
      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ai-response.outputs.response }}" >> $GITHUB_STEP_SUMMARY
