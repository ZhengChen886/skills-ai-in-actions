name: Ask AI
on:
  workflow_dispatch:

permissions:
  models: read          # ← 必须缩进 2 空格，与 jobs 同级

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Give me a programming joke.
